---
steps:
  - id: write-app-version
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - 'printf "%s" "${COMMIT_SHA}" > .application-version'

  - id: docker-build-eq-runner
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - "--platform=${_PLATFORM}"
      - "--push"
      - "-t"
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-runner:${SHORT_SHA}"
      - "-t"
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-runner:latest"
      - "."

  - id: create-and-deploy-runner-release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - create
      - "rel-${BUILD_ID}"
      - "--delivery-pipeline=${_DELIVERY_PIPELINE}"
      - "--region=${_REGION}"
      - "--source=."
      - "--gcs-source-staging-dir=gs://${_PROJECT_ID}-${_REGION}-clouddeploy-artifacts/source"
      - "--images=runner-image=europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-runner:${SHORT_SHA}"
      - "--to-target=${_TARGET}"
    wait_for:
      - docker-build-eq-runner

substitutions:
  _PLATFORM: "linux/amd64"
  _REGION: "europe-west2"
  _DELIVERY_PIPELINE: "runner-dev"
  _TARGET: "runner-dev"

options:
  logging: CLOUD_LOGGING_ONLY
