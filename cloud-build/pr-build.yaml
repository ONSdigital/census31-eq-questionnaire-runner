---
steps:
  - id: write-app-version
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - 'printf "%s" "${SHORT_SHA}" > .application-version'
      
  - id: docker-build-eq-runner
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - "--platform=${_PLATFORM}"
      - "--load"
      - "-t"
      - "runner-pr:${SHORT_SHA}"
      - "."

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PLATFORM: "linux/amd64"
