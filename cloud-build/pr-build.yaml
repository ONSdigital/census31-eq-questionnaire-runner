---
steps:
  - id: write-app-version
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - 'printf "%s" "${SHORT_SHA}" > .application-version'

  - id: docker-build-eq-runner
    name: gcr.io/cloud-builders/docker
    secretEnv:
      - LOAD_RELEASE_PAT
    args:
      - buildx
      - build
      - "--platform=${_PLATFORM}"
      - "--secret=id=LOAD_RELEASE_PAT,env=LOAD_RELEASE_PAT"
      - "--load"
      - "-t"
      - "runner-pr:${SHORT_SHA}"
      - "."

availableSecrets:
  secretManager:
    - versionName: "${_LOAD_RELEASE_PAT_SECRET}/versions/latest"
      env: LOAD_RELEASE_PAT

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PLATFORM: "linux/amd64"
