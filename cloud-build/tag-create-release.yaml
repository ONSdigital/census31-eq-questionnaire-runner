---
steps:
  - id: write-app-version
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - 'printf "%s" "${TAG_NAME}" > .application-version'

  - id: docker-build-eq-runner-release
    name: gcr.io/cloud-builders/docker
    secretEnv:
      - LOAD_RELEASE_PAT
    args:
      - buildx
      - build
      - "--platform=${_PLATFORM}"
      - "--secret=id=LOAD_RELEASE_PAT,env=LOAD_RELEASE_PAT"
      - "--push"
      - "-t"
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-runner:${TAG_NAME}"
      - "."

  - id: create-and-deploy-runner-release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - create
      - "rel-${BUILD_ID}"
      - "--delivery-pipeline=${_DELIVERY_PIPELINE}"
      - "--region=${_REGION}"
      - "--source=."
      - "--gcs-source-staging-dir=gs://${_PROJECT_ID}-${_REGION}-clouddeploy-artifacts/source"
      - "--images=runner-image=europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-runner:${TAG_NAME}"
      - "--to-target=${_TARGET}"
    wait_for:
      - docker-build-eq-runner-release

availableSecrets:
  secretManager:
    - versionName: "${_LOAD_RELEASE_PAT_SECRET}/versions/latest"
      env: LOAD_RELEASE_PAT

substitutions:
  _PLATFORM: "linux/amd64"
  _REGION: "europe-west2"
  _DELIVERY_PIPELINE: "runner-release"
  _TARGET: "runner-test"

options:
  logging: CLOUD_LOGGING_ONLY
