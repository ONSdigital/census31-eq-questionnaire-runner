[tool.djlint]
profile = "jinja"
blank_line_after_tag="load,extends,import,from"
blank_line_before_tag="load,extends,block"
max_line_length=160
# _base.html excluded due to the bad </script> nesting after format
exclude=".templates/layouts/_base.html"
# when using double quote escape sequence in strings we get "H025 Tag seems to be an orphan" false positives
ignore="H025"

[tool.poetry]
name = "eq-questionnaire-runner"
version = "1.0.0"
description = "ONS Digital eQ Questionnaire Runner App"
authors = ["ONSDigital"]

[tool.poetry.group.dev.dependencies]
# update dependabot.yaml when adding new dependencies
beautifulsoup4 = "^4.15.0"
black = "^26.10.1"
click = "^8.5.0" # forcing version compatible with djlint
djlint = "^1.46.6"
fakeredis = "^2.40.0"
freezegun = "^1.5.5"
httmock = "^1.4.0"
jsonschema = "^4.26.0"
mock = "^5.2.0"
mypy = "^2.4.0"
pep8 = "^1.7.1"
playwright = "^1.64.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-flask = "^1.3.0"
pytest-mock = "^3.17.0"
pytest-sugar = "^1.1.1"
pytest-xdist = "^3.8.0"
responses = "^0.26.3"
ruff = "^0.16.10"
types-cachetools = "^7.0.0.20260713"
types-python-dateutil = "^2.9.0.20261021"
types-PyYAML = "^6.0.12.20260906"
types-redis = "^4.6.0.20241004"
types-requests = "^2.33.0.20261006"
types-simplejson = "^4.2.0.20261006"
types-pytz = "^2026.5.0.20261006"


[tool.poetry.dependencies]
# update dependabot.yaml when adding new dependencies
babel = ">=2.18.0"
cachetools = "^7.2.4"
coloredlogs = "^15.0.1"
email-validator = "^2.3.0"
flask = "^3.1.3"
flask-babel = "^4.0.0"
flask-compress = "^1.25"
flask-login = "^0.6.3"
flask-talisman = "^1.1.0"
flask-wtf = "^1.3.0"
gevent = "^26.9.0"
google-cloud-datastore = "^2.27.0"
google-cloud-pubsub = "^2.43.0"
google-cloud-storage = "^3.17.1"
google-cloud-tasks = "^2.26.0"
gunicorn = {version = "^26.2.0", extras = ["gevent"]}
htmlmin2 = "^0.1.13"
jsonpointer = "^3.4"
marshmallow = "^4.3.1"
ordered-set = "^4.1.0"
python = "^3.13.5"
python-dateutil = "^2.9.0.post0"
python-snappy = "^0.7.3"
redis = "^8.1.0"
requests = "^2.34.2"
sdc-cryptography = "^1.4.0"
simplejson = "^4.2.0"
structlog = "^26.1.0"
wtforms = "^3.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
target-version = "py313"
include = ["*.py"]
line-length = 120
indent-width = 4
cache-dir = "~/.cache/ruff"

[tool.ruff.lint]
extend-ignore = [
    "A005", # Reusing a builtin module name for the name of a module
    "B024", # No abstract methods in abstract base class
    "B027", # Non-abstract empty methods in abstract base classes
    "B028",# No explicit keyword argument found
    "B905", # zip() without an explicit strict= parameter
    "RUF100", # Allow  Unused blanket `noqa` directive
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF005", # Consider {expression} instead of concatenation
    "RUF009", # Do not perform function call `lazy_gettext` in dataclass defaults
    "RUF015", # Prefer `next(...)` over single element slice
    "RUF010", # Use explicit conversion flag
    "RUF001", # String contains ambiguous character
    "ARG001", # Allow  Unused function argument: `method_name`
    "ARG002", # Unused method argument
    "ARG004", # Unused static method argument: `kwargs
    "N818", # Exception name should be named with an Error suffix
    "UP032", # Use f-string instead of `format` call
    "UP018", # Unnecessary {literal_type} call (rewrite as a literal)
    "UP015", # Unnecessary open mode parameters
    "UP009", # UTF-8 encoding declaration is unnecessary
    "UP017", # Use `datetime.UTC` alias
    "UP033", # Use @functools.cache instead of @functools.lru_cache(maxsize=None)
    "UP037", # Remove quotes from type annotation
    "UP035", # Import from {target} instead: {names}
    "UP040", # Type alias {name} uses {type_alias_method} instead of the type keyword
    "S105", # Possible hardcoded password assigned to: "{}"
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "C408", # Unnecessary `tuple` call (rewrite as a literal)
    "C400", # Unnecessary generator (rewrite as a `list` comprehension)
    "N802", # Function name {name} should be lowercase
    "I001", # Import block is un-sorted or un-formatted
    "FBT001", # Boolean-typed keyword argument in function definition
    "FBT002", # Boolean-typed positional argument in function definition
    "FBT003", # Boolean positional value in function call
    "COM812", # Trailing comma missing
    "G004", # Logging statement uses f-string
    "PIE810", # Call {attr} once with a tuple
    "PIE800", # Unnecessary spread **
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY400", # Use logging.exception instead of logging.error
    "TRY201", # Avoid using `raise Exception` without specifying an exception class
    "TRY300", # Consider moving this statement to an `else` block
    "RET501", # Do not explicitly `return None` in function if it is the only possible return value
    "RET503", # Missing explicit `return` at the end of function able to return non-`None` value
    "RET504", # Unnecessary assignment to `context` before `return` statement
    "PLR2004", # Magic value used in comparison
]
extend-select = [
    "E4", "E7", "E9", "E5", # On top of the defaults (`E4`, E7`, `E9`, and `F`), enable E5 (Adds line length check - error "E501")
    "Q",  # flake8-quotes (Q)
    "B", # flake8-bugbear (B)
    "A", # flake8-builtins (A)
    "BLE", # flake8-blind-except (BLE)
    "C4", # flake8-comprehensions (C4)
    "PIE", # flake8-pie (PIE)
    "SLF", # flake8-self (SLF)
    "ARG", # flake8-unused-arguments (ARG)
    "YTT", # flake8-2020 (YTT)
    "C", # flake8-comprehensions (C)
    "DTZ", # flake8-datetimez (DTZ)
    "S", # flake8-bandit (S)
    "TID", # flake8-tidy-imports (TID)
    "ICN", # flake8-import-conventions (ICN)
    "ISC", # flake8-implicit-str-concat (ISC)
    "COM", # flake8-commas (COM)
    "LOG", # flake8-logging (LOG)
    "G", # flake8-logging-format (G)
    "EM", # flake8-errmsg (EM)
    "FBT", # flake8-boolean-trap (FBT)
    "TD", # flake8-todo (TD)
    "FA", # flake8-future-annotations (FA)
    "T20", # flake8-print (T20)
    "RET", # flake8-return (RET)
    "E", # pycodestyle Error (E)
    "W", # pycodestyle Warning (W)
    "F", # pyflakes (F)
    "I", # isort (I)
    "N", # pep8-naming (N)
    "RUF", # Ruff-specific rules (RUF)
    "UP", # pyupgrade (UP)
    "ERA", # eradicate (ERA)
    "FURB", # refurb (FURB)
    "TRY", # tryceratops (TRY)
    "FLY", # flynt (FLY)
    "PERF", # Perflint (PERF)
    "PL", # pylint (PL)
]

[tool.ruff.lint.per-file-ignores]
"tests/functional/generate_pages.py" = ["E501"]  # Auto-generated TypeScript templates with long lines
"scripts/*.py" = ["S603", "S607", "LOG015"]  # Utility scripts using subprocess and logging
"tests/**/*.py" = ["SLF001", "S101"] # Tests accessing private members of mocks and internal implementations and asserts

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-args = 11
max-positional-args = 11
max-statements = 60
