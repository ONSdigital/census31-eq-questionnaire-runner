services:
  datastore:
    image: pricemonsdigital/gcloud-datastore-emulator:2.3.1
    environment:
      - CLOUDSDK_CORE_PROJECT=local
    networks:
      - eq-env
    ports:
      - "8432:8432"

  redis:
    image: redis:7.2
    networks:
      - eq-env
    ports:
      - "6379:6379"

  runner:
    image: europe-west2-docker.pkg.dev/census-eq-ci/docker-images/census31-eq-questionnaire-runner:latest
    build:
      context: ./
      args:
        RUNTIME_BASE_IMAGE_TAG: ${RUNTIME_BASE_IMAGE_TAG:-nonroot}
    env_file:
      - ${RUNNER_ENV_FILE}
    environment:
      DATASTORE_EMULATOR_HOST: datastore:8432
      EQ_REDIS_HOST: "redis"
    volumes:
      - ./dev-secrets.yml:/runner/dev-secrets.yml:ro
      - ./dev-keys.yml:/runner/dev-keys.yml:ro
    restart: always
    depends_on:
      - datastore
      - redis
    networks:
      - eq-env
    ports:
      - "5000:5000"

  launcher:
    image: europe-west2-docker.pkg.dev/ons-eq-ci/docker-images/eq-questionnaire-launcher:latest
    environment:
      SURVEY_RUNNER_URL: http://localhost:5000
      SURVEY_RUNNER_SCHEMA_URL: http://host.docker.internal:5000
    restart: always
    networks:
      - eq-env
    ports:
      - "8000:8000"

networks:
  eq-env:
    driver: bridge
